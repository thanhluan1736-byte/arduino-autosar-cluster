<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img">
<title>Wiring of the mini AUTOSAR cluster on the MaaZEDU S32K144 board (header J8)</title>
<desc>Joystick to J8-22 3.3V, J8-24 GND, J8-18 VRy, J8-20 VRx, J8-5 SW; buzzer to J8-11 and GND; LCD1602 I2C to J8-12 SDA, J8-10 SCL, 3.3V, GND; ULN2003 IN1..IN4 to J8-19, J8-17, J8-15, J8-13, motor power from the breadboard power module with a common GND.</desc>
<rect width="680" height="560" fill="#1f1f1e"/>
<rect x="250" y="50" width="180" height="440" rx="8" fill="#444441" stroke="#888780" stroke-width="0.8"/>
<text x="340" y="74" fill="#e8e6dc" font-size="14" font-weight="600" text-anchor="middle">MaaZEDU S32K144</text>
<text x="340" y="92" fill="#b4b2a9" font-size="12" text-anchor="middle">header J8 (3.3 V logic!)</text>
<g fill="#d3d1c7" font-size="12">
<text x="258" y="119">J8-22 3.3V</text><text x="258" y="139">J8-24 GND</text><text x="258" y="159">J8-18 SE12</text>
<text x="258" y="179">J8-20 SE13</text><text x="258" y="199">J8-5 PTE0</text>
<text x="258" y="299">J8-11 PTD13</text><text x="258" y="319">J8-24 GND</text>
<text x="422" y="119" text-anchor="end">J8-12 SDA</text><text x="422" y="139" text-anchor="end">J8-10 SCL</text>
<text x="422" y="159" text-anchor="end">J8-22 3.3V</text><text x="422" y="179" text-anchor="end">J8-24 GND</text>
<text x="422" y="259" text-anchor="end">J8-19 PTD9</text><text x="422" y="279" text-anchor="end">J8-17 PTD10</text>
<text x="422" y="299" text-anchor="end">J8-15 PTD11</text><text x="422" y="319" text-anchor="end">J8-13 PTD12</text>
<text x="422" y="454" text-anchor="end">J8-24 GND</text>
<text x="340" y="474" text-anchor="middle">red LED (PTD15) = telltale, USB = log</text>
</g>
<g fill="#3c3489" stroke="#afa9ec" stroke-width="0.8">
<rect x="40" y="80" width="150" height="130" rx="8"/>
<rect x="40" y="260" width="150" height="70" rx="8"/>
<rect x="490" y="80" width="150" height="110" rx="8"/>
<rect x="490" y="220" width="150" height="116" rx="8"/>
<rect x="490" y="420" width="150" height="56" rx="8"/>
</g>
<g fill="#eeedfe" font-size="14" font-weight="600" text-anchor="middle">
<text x="115" y="101">Joystick</text>
<text x="115" y="281">Buzzer</text>
<text x="565" y="101">LCD1602 I2C</text>
<text x="565" y="241">ULN2003 + 28BYJ-48</text>
<text x="565" y="443">Power module</text>
</g>
<g fill="#cecbf6" font-size="12">
<text x="52" y="119">+5V pin (to 3.3V)</text><text x="52" y="139">GND</text><text x="52" y="159">VRy</text>
<text x="52" y="179">VRx</text><text x="52" y="199">SW</text>
<text x="52" y="299">+ (or S)</text><text x="52" y="319">− (GND)</text>
<text x="628" y="119" text-anchor="end">SDA</text><text x="628" y="139" text-anchor="end">SCL</text>
<text x="628" y="159" text-anchor="end">VCC</text><text x="628" y="179" text-anchor="end">GND</text>
<text x="628" y="259" text-anchor="end">IN1</text><text x="628" y="279" text-anchor="end">IN2</text>
<text x="628" y="299" text-anchor="end">IN3</text><text x="628" y="319" text-anchor="end">IN4</text>
<text x="502" y="330">+  −</text>
<text x="565" y="463" text-anchor="middle">5V for the motor</text>
</g>
<g stroke-width="1.5" fill="none">
<line x1="190" y1="115" x2="250" y2="115" stroke="#ef9f27"/>
<line x1="190" y1="135" x2="250" y2="135" stroke="#888780" stroke-dasharray="4 3"/>
<line x1="190" y1="155" x2="250" y2="155" stroke="#1d9e75"/>
<line x1="190" y1="175" x2="250" y2="175" stroke="#1d9e75"/>
<line x1="190" y1="195" x2="250" y2="195" stroke="#1d9e75"/>
<line x1="190" y1="295" x2="250" y2="295" stroke="#1d9e75"/>
<line x1="190" y1="315" x2="250" y2="315" stroke="#888780" stroke-dasharray="4 3"/>
<line x1="430" y1="115" x2="490" y2="115" stroke="#1d9e75"/>
<line x1="430" y1="135" x2="490" y2="135" stroke="#1d9e75"/>
<line x1="430" y1="155" x2="490" y2="155" stroke="#ef9f27"/>
<line x1="430" y1="175" x2="490" y2="175" stroke="#888780" stroke-dasharray="4 3"/>
<line x1="430" y1="255" x2="490" y2="255" stroke="#1d9e75"/>
<line x1="430" y1="275" x2="490" y2="275" stroke="#1d9e75"/>
<line x1="430" y1="295" x2="490" y2="295" stroke="#1d9e75"/>
<line x1="430" y1="315" x2="490" y2="315" stroke="#1d9e75"/>
<line x1="507" y1="336" x2="507" y2="420" stroke="#e24b4a"/>
<line x1="521" y1="336" x2="521" y2="420" stroke="#888780" stroke-dasharray="4 3"/>
<line x1="430" y1="450" x2="490" y2="450" stroke="#888780" stroke-dasharray="4 3"/>
<line x1="40" y1="530" x2="70" y2="530" stroke="#1d9e75"/>
<line x1="150" y1="530" x2="180" y2="530" stroke="#ef9f27"/>
<line x1="250" y1="530" x2="280" y2="530" stroke="#e24b4a"/>
<line x1="330" y1="530" x2="360" y2="530" stroke="#888780" stroke-dasharray="4 3"/>
</g>
<g fill="#d3d1c7" font-size="12">
<text x="78" y="534">Signal</text>
<text x="188" y="534">3.3V</text>
<text x="288" y="534">5V</text>
<text x="368" y="534">GND (all grounds common)</text>
</g>
</svg>
