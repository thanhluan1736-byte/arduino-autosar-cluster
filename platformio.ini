; Mini AUTOSAR instrument cluster - Arduino Uno (ATmega328P), bare metal (no Arduino core)
; Portable layers live in src/, the AVR MCAL in platform/avr/.
; The MaaZEDU S32K144 version is built with platform/s32k144/Makefile instead.
[platformio]
src_dir = .

[env:uno]
platform = atmelavr
board = uno
; no "framework =" line: plain avr-gcc + avr-libc, our own MCAL drives the registers
build_src_filter = -<*> +<src/> +<platform/avr/>
build_flags =
    -std=gnu11
    -Wall
    -Wextra
    -Werror
    -Isrc/Common
    -Isrc/Ecual
    -Isrc/Cdd
    -Isrc/Service
    -Isrc/Rte
    -Isrc/Swc
    -Iplatform/avr
    -Iplatform/avr/Mcal
monitor_speed = 115200
