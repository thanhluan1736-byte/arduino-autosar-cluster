; Mini AUTOSAR instrument cluster - Arduino Uno (ATmega328P), bare metal (no Arduino core)
[env:uno]
platform = atmelavr
board = uno
; no "framework =" line: plain avr-gcc + avr-libc, our own MCAL drives the registers
build_flags =
    -std=gnu11
    -Wall
    -Wextra
    -Werror
    -Isrc/Common
    -Isrc/Mcal
    -Isrc/Ecual
    -Isrc/Cdd
    -Isrc/Service
    -Isrc/Rte
    -Isrc/Swc
monitor_speed = 115200
